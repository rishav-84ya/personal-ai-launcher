name: Start Personal AI

on:
  workflow_dispatch:
    inputs:
      kernel_slug:
        description: "Compatibility input; workflow is pinned to notebook-v21"
        required: false
        default: "tipsofficial/notebook-v21"
      accelerator:
        description: "Kaggle accelerator"
        required: false
        default: "NvidiaTeslaT4"

permissions:
  contents: read

concurrency:
  group: personal-ai-kaggle
  cancel-in-progress: false

jobs:
  start-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      TARGET_KERNEL: "tipsofficial/notebook-v21"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Verify Kaggle authentication
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_API_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub secret KAGGLE_API_TOKEN"
            exit 1
          fi
          kaggle kernels list --mine --page-size 5

      - name: Resolve exact Personal AI notebook
        id: target
        shell: bash
        env:
          INPUT_ACCELERATOR: ${{ inputs.accelerator }}
        run: |
          set -euo pipefail
          KERNEL_SLUG="$TARGET_KERNEL"
          ACCELERATOR="${INPUT_ACCELERATOR:-NvidiaTeslaT4}"

          echo "kernel_slug=$KERNEL_SLUG" >> "$GITHUB_OUTPUT"
          echo "accelerator=$ACCELERATOR" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "EXACT Kaggle notebook to start:"
          echo "https://www.kaggle.com/code/${KERNEL_SLUG}"
          echo "Kernel slug: $KERNEL_SLUG"
          echo "Accelerator: $ACCELERATOR"
          echo "=========================================="

      - name: Pull exact notebook and metadata
        shell: bash
        env:
          KERNEL_SLUG: ${{ steps.target.outputs.kernel_slug }}
        run: |
          set -euo pipefail
          rm -rf /tmp/personal-ai
          mkdir -p /tmp/personal-ai

          kaggle kernels pull             "$KERNEL_SLUG"             -p /tmp/personal-ai             -m

          echo "===== Downloaded files ====="
          find /tmp/personal-ai -maxdepth 2 -type f -print

          META="/tmp/personal-ai/kernel-metadata.json"
          if [[ ! -f "$META" ]]; then
            echo "::error::kernel-metadata.json was not downloaded."
            exit 1
          fi

          echo "===== Pulled metadata ====="
          cat "$META"

      - name: Pin metadata to notebook-v21
        shell: bash
        env:
          KERNEL_SLUG: ${{ steps.target.outputs.kernel_slug }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("/tmp/personal-ai")
          meta_path = root / "kernel-metadata.json"
          meta = json.loads(meta_path.read_text(encoding="utf-8"))

          expected = os.environ["KERNEL_SLUG"]
          meta["id"] = expected

          code_file = meta.get("code_file")
          if not code_file or not (root / code_file).exists():
              notebooks = sorted(root.glob("*.ipynb"))
              scripts = sorted(root.glob("*.py"))

              if notebooks:
                  code_file = notebooks[0].name
                  meta["kernel_type"] = "notebook"
              elif scripts:
                  code_file = scripts[0].name
                  meta["kernel_type"] = "script"
              else:
                  raise SystemExit("No notebook/script was pulled from Kaggle.")

              meta["code_file"] = code_file

          meta["language"] = "python"

          meta_path.write_text(
              json.dumps(meta, indent=2) + "\n",
              encoding="utf-8",
          )

          print("Verified target:", expected)
          print("Code file:", code_file)
          print(meta_path.read_text(encoding="utf-8"))
          PY

      - name: Enable Internet and T4 x2
        shell: bash
        env:
          ACCELERATOR: ${{ steps.target.outputs.accelerator }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("/tmp/personal-ai/kernel-metadata.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          data["enable_internet"] = True
          data["enable_gpu"] = True
          data["machine_shape"] = os.environ["ACCELERATOR"]

          path.write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8",
          )

          print("===== Final metadata =====")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Start exact notebook-v21
        shell: bash
        env:
          KERNEL_SLUG: ${{ steps.target.outputs.kernel_slug }}
          ACCELERATOR: ${{ steps.target.outputs.accelerator }}
        run: |
          set -euo pipefail
          echo "Starting ONLY: $KERNEL_SLUG"

          kaggle kernels push             -p /tmp/personal-ai             --accelerator "$ACCELERATOR"

      - name: Verify Kaggle accepted notebook-v21 run
        shell: bash
        env:
          KERNEL_SLUG: ${{ steps.target.outputs.kernel_slug }}
        run: |
          set -euo pipefail
          echo "Polling: $KERNEL_SLUG"

          for i in {1..18}; do
            echo "===== Status check $i ====="
            OUT="$(kaggle kernels status "$KERNEL_SLUG" 2>&1 || true)"
            echo "$OUT"

            if echo "$OUT" | grep -Eiq 'error|failed|cancelled'; then
              echo "::error::Kaggle reported failed/cancelled."
              exit 1
            fi

            if echo "$OUT" | grep -Eiq 'running|queued|complete'; then
              echo "✅ Kaggle accepted notebook-v21."
              exit 0
            fi

            sleep 10
          done

          echo "::warning::Push succeeded, but status did not settle within the polling window."

      - name: Startup submitted
        run: |
          echo "✅ Personal AI startup submitted"
          echo "Notebook: https://www.kaggle.com/code/tipsofficial/notebook-v21"
          echo "Kernel: ${{ steps.target.outputs.kernel_slug }}"
          echo "Accelerator: ${{ steps.target.outputs.accelerator }}"
