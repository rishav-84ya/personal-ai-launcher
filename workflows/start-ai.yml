name: Start Personal AI

on:
  workflow_dispatch:

jobs:
  start-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade kaggle

      - name: Download notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KERNEL: ${{ secrets.KAGGLE_KERNEL }}
        run: |
          mkdir -p /tmp/personal-ai

          kaggle kernels pull \
            "$KAGGLE_KERNEL" \
            -p /tmp/personal-ai \
            -m

      - name: Start Kaggle notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push \
            -p /tmp/personal-ai \
            --accelerator NvidiaTeslaT4
