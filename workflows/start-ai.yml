name: Start Personal AI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-ai-kaggle
  cancel-in-progress: false

jobs:
  start-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Verify Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels list --mine --page-size 5

      - name: Show Kaggle quota
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle quota --format table || true

      - name: Download Personal AI notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KERNEL: ${{ secrets.KAGGLE_KERNEL }}
        run: |
          mkdir -p /tmp/personal-ai

          kaggle kernels pull \
            "$KAGGLE_KERNEL" \
            -p /tmp/personal-ai \
            -m

          echo "===== Downloaded files ====="
          ls -la /tmp/personal-ai

          echo "===== Original metadata ====="
          cat /tmp/personal-ai/kernel-metadata.json

      - name: Enable Internet and GPU
        run: |
          python - <<'PY'
          import json

          path = "/tmp/personal-ai/kernel-metadata.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          data["enable_internet"] = True
          data["enable_gpu"] = True

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          print("===== Updated metadata =====")
          print(json.dumps(data, indent=2))
          PY

      - name: Start Kaggle notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push \
            -p /tmp/personal-ai \
            --accelerator NvidiaTeslaT4

      - name: Startup submitted
        run: |
          echo "✅ Personal AI startup submitted to Kaggle"