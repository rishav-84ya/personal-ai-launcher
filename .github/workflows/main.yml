      - name: Download notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KERNEL: ${{ secrets.KAGGLE_KERNEL }}
        run: |
          mkdir -p /tmp/personal-ai

          kaggle kernels pull \
            "$KAGGLE_KERNEL" \
            -p /tmp/personal-ai \
            -m

          echo "Downloaded files:"
          ls -la /tmp/personal-ai


      - name: Enable Internet and GPU
        run: |
          python - <<'PY'
          import json
          import os

          path = "/tmp/personal-ai/kernel-metadata.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          data["enable_internet"] = True
          data["enable_gpu"] = True

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          print("Updated kernel metadata:")
          print(json.dumps(data, indent=2))
          PY


      - name: Start Kaggle notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push \
            -p /tmp/personal-ai \
            --accelerator NvidiaTeslaT4
