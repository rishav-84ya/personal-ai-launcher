name: Start Personal AI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-ai-kaggle
  cancel-in-progress: false

jobs:
  start-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # GitHub Repository Secrets
      # KAGGLE_API_TOKEN = Kaggle API token for the OWNER of the notebook
      # KAGGLE_KERNEL    = owner/slug, e.g. tipsofficial/notebook-v21
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: ${{ secrets.KAGGLE_KERNEL }}

      # This is ONLY used to verify that the EXISTING Kaggle notebook
      # already has the private dataset attached.
      #
      # IMPORTANT:
      # We deliberately DO NOT run `kaggle datasets files` here.
      # That call requires the GitHub-side Kaggle identity to have
      # dataset permission and was the direct cause of the 403.
      KAGGLE_SECRET_DATASET: "tipsofficial/personal-ai-secrets"

      # Fixed hardware choice.
      KAGGLE_ACCELERATOR: "NvidiaTeslaT4"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate launcher configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${KAGGLE_API_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Repository Secret: KAGGLE_API_TOKEN"
            exit 1
          fi

          if [[ -z "${KAGGLE_KERNEL:-}" ]]; then
            echo "::error::Missing GitHub Repository Secret: KAGGLE_KERNEL"
            echo "::error::Set it to owner/slug, for example: tipsofficial/notebook-v21"
            exit 1
          fi

          if [[ ! "${KAGGLE_KERNEL}" =~ ^[^/]+/[^/]+$ ]]; then
            echo "::error::KAGGLE_KERNEL must be owner/slug, not a full Kaggle URL."
            exit 1
          fi

          if [[ ! "${KAGGLE_SECRET_DATASET}" =~ ^[^/]+/[^/]+$ ]]; then
            echo "::error::KAGGLE_SECRET_DATASET must be owner/slug."
            exit 1
          fi

          echo "✅ Kaggle token is present"
          echo "✅ Target kernel: ${KAGGLE_KERNEL}"
          echo "✅ Expected private dataset attachment: ${KAGGLE_SECRET_DATASET}"
          echo "✅ Accelerator: ${KAGGLE_ACCELERATOR}"

      - name: Install Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Verify Kaggle authentication
        shell: bash
        run: |
          set -euo pipefail

          kaggle kernels list --mine --page-size 20

          echo "✅ Kaggle authentication works"

      - name: Pull existing Kaggle notebook
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="${RUNNER_TEMP}/personal-ai"
          rm -rf "${WORK_DIR}"
          mkdir -p "${WORK_DIR}"

          echo "Pulling existing kernel: ${KAGGLE_KERNEL}"

          kaggle kernels pull \
            "${KAGGLE_KERNEL}" \
            -p "${WORK_DIR}" \
            -m

          test -f "${WORK_DIR}/kernel-metadata.json" || {
            echo "::error::kernel-metadata.json was not returned."
            exit 1
          }

          echo "WORK_DIR=${WORK_DIR}" >> "${GITHUB_ENV}"

          echo "===== Pulled files ====="
          find "${WORK_DIR}" -maxdepth 2 -type f -print

      - name: Preserve existing Kaggle attachments and force T4
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["WORK_DIR"])
          meta_path = root / "kernel-metadata.json"

          meta = json.loads(
              meta_path.read_text(encoding="utf-8")
          )

          # Keep the exact kernel identity supplied by GitHub.
          meta["id"] = os.environ["KAGGLE_KERNEL"]

          code_file = meta.get("code_file")

          if not code_file or not (root / code_file).is_file():
              notebooks = sorted(root.glob("*.ipynb"))
              scripts = sorted(root.glob("*.py"))

              if notebooks:
                  code_file = notebooks[0].name
                  meta["kernel_type"] = "notebook"
              elif scripts:
                  code_file = scripts[0].name
                  meta["kernel_type"] = "script"
              else:
                  raise SystemExit("No .ipynb or .py file was pulled.")

              meta["code_file"] = code_file

          meta["language"] = "python"
          meta["enable_internet"] = True
          meta["enable_gpu"] = True
          meta["machine_shape"] = os.environ["KAGGLE_ACCELERATOR"]

          # CRITICAL:
          # Do NOT add/remove dataset_sources here.
          #
          # The notebook was already configured in Kaggle manually.
          # kaggle kernels pull returns its current dataset_sources.
          # We preserve those sources exactly so the private
          # personal-ai-secrets dataset remains attached.
          sources = meta.get("dataset_sources", [])

          if sources is None:
              sources = []
          elif isinstance(sources, str):
              sources = [sources]
          elif not isinstance(sources, list):
              sources = list(sources)

          clean_sources = []
          for item in sources:
              item = str(item).strip()
              if item and item not in clean_sources:
                  clean_sources.append(item)

          meta["dataset_sources"] = clean_sources

          expected = os.environ["KAGGLE_SECRET_DATASET"]

          print("===== Existing Kaggle dataset attachments =====")
          for item in clean_sources:
              print("  -", item)

          if expected not in clean_sources:
              raise SystemExit(
                  "\nERROR: The existing Kaggle notebook does not report "
                  f"the required private dataset '{expected}' in "
                  "kernel-metadata.json.\n\n"
                  "Attach that PRIVATE dataset to the notebook once in "
                  "the Kaggle UI, save the notebook, then run this "
                  "workflow again.\n\n"
                  "The GitHub runner intentionally does not call "
                  "'kaggle datasets files' and does not attempt to "
                  "grant/access a private dataset."
              )

          meta_path.write_text(
              json.dumps(meta, indent=2) + "\n",
              encoding="utf-8",
          )

          print("==============================================")
          print("✅ Existing private dataset attachment preserved")
          print("✅ Kernel:", meta["id"])
          print("✅ Code file:", meta["code_file"])
          print("✅ Machine:", meta["machine_shape"])
          PY

      - name: Validate final Kaggle metadata
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["WORK_DIR"]) / "kernel-metadata.json"
          meta = json.loads(path.read_text(encoding="utf-8"))

          if meta.get("id") != os.environ["KAGGLE_KERNEL"]:
              raise SystemExit(
                  f"Kernel identity mismatch: {meta.get('id')!r}"
              )

          if meta.get("machine_shape") != os.environ["KAGGLE_ACCELERATOR"]:
              raise SystemExit(
                  f"Machine shape mismatch: {meta.get('machine_shape')!r}"
              )

          datasets = meta.get("dataset_sources") or []

          if os.environ["KAGGLE_SECRET_DATASET"] not in datasets:
              raise SystemExit(
                  "Required private dataset is not attached."
              )

          print("✅ Metadata validation passed")
          print("Kernel:", meta["id"])
          print("Machine:", meta["machine_shape"])
          print("Private dataset attachment: present")
          PY

      - name: Push existing notebook back to Kaggle
        shell: bash
        run: |
          set -euo pipefail

          echo "🚀 Starting ${KAGGLE_KERNEL}"

          # No --accelerator flag here.
          # machine_shape is already in kernel-metadata.json.
          kaggle kernels push \
            -p "${WORK_DIR}"

          echo "✅ Kaggle push accepted"

      - name: Confirm Kaggle run
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..18}; do
            echo "===== status check ${i}/18 ====="

            OUT="$(
              kaggle kernels status "${KAGGLE_KERNEL}" 2>&1 || true
            )"

            echo "${OUT}"

            if echo "${OUT}" | grep -Eiq \
              'error|failed|failure|cancelled|canceled'; then
              echo "::error::Kaggle reported a failed/cancelled run."
              exit 1
            fi

            if echo "${OUT}" | grep -Eiq \
              'running|queued|pending'; then
              echo "✅ Personal AI is queued/running."
              exit 0
            fi

            if echo "${OUT}" | grep -Eiq \
              'complete|completed'; then
              echo "::warning::Notebook already completed. Check Kaggle output."
              exit 0
            fi

            sleep 10
          done

          echo "::warning::Push succeeded but status did not settle in the polling window."
          exit 0

      - name: Startup submitted
        run: |
          echo "✅ Personal AI wake request submitted"
          echo "Notebook: ${KAGGLE_KERNEL}"
          echo "Private dataset attachment: verified from kernel metadata"
          echo "Accelerator: ${KAGGLE_ACCELERATOR}"
