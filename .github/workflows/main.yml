name: Start Personal AI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-ai-kaggle
  cancel-in-progress: false

jobs:
  start-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # GitHub Repository Secrets
      # KAGGLE_API_TOKEN = Kaggle API token for the owner of the notebook
      # KAGGLE_KERNEL    = owner/slug
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: ${{ secrets.KAGGLE_KERNEL }}

      # Existing PRIVATE Kaggle dataset containing secrets.json.
      KAGGLE_SECRET_DATASET: "tipsofficial/personal-ai-secrets"

      # Personal AI GPU
      KAGGLE_ACCELERATOR: "NvidiaTeslaT4"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate launcher configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${KAGGLE_API_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Repository Secret: KAGGLE_API_TOKEN"
            exit 1
          fi

          if [[ -z "${KAGGLE_KERNEL:-}" ]]; then
            echo "::error::Missing GitHub Repository Secret: KAGGLE_KERNEL"
            echo "::error::Set it to owner/slug, for example: tipsofficial/rish84y"
            exit 1
          fi

          if [[ ! "${KAGGLE_KERNEL}" =~ ^[^/]+/[^/]+$ ]]; then
            echo "::error::KAGGLE_KERNEL must be owner/slug, not a full Kaggle URL."
            exit 1
          fi

          echo "✅ Kaggle token is present"
          echo "✅ Target kernel: ${KAGGLE_KERNEL}"
          echo "✅ Secret dataset: ${KAGGLE_SECRET_DATASET}"
          echo "✅ Accelerator: ${KAGGLE_ACCELERATOR}"

      - name: Install Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Verify Kaggle authentication
        shell: bash
        run: |
          set -euo pipefail

          kaggle kernels list --mine --page-size 20

          echo "✅ Kaggle authentication works"

      - name: Pull existing Kaggle notebook
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="${RUNNER_TEMP}/personal-ai"
          rm -rf "${WORK_DIR}"
          mkdir -p "${WORK_DIR}"

          echo "Pulling existing kernel: ${KAGGLE_KERNEL}"

          kaggle kernels pull \
            "${KAGGLE_KERNEL}" \
            -p "${WORK_DIR}" \
            -m

          test -f "${WORK_DIR}/kernel-metadata.json" || {
            echo "::error::kernel-metadata.json was not returned."
            exit 1
          }

          echo "WORK_DIR=${WORK_DIR}" >> "${GITHUB_ENV}"

          echo "===== Pulled files ====="
          find "${WORK_DIR}" -maxdepth 2 -type f -print

      - name: Attach private Personal AI secrets dataset and force T4
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["WORK_DIR"])
          meta_path = root / "kernel-metadata.json"

          meta = json.loads(meta_path.read_text(encoding="utf-8"))

          # Always target the exact notebook configured in GitHub.
          meta["id"] = os.environ["KAGGLE_KERNEL"]

          # Find the pulled code file if Kaggle did not provide one.
          code_file = meta.get("code_file")

          if not code_file or not (root / code_file).is_file():
              notebooks = sorted(root.glob("*.ipynb"))
              scripts = sorted(root.glob("*.py"))

              if notebooks:
                  code_file = notebooks[0].name
                  meta["kernel_type"] = "notebook"
              elif scripts:
                  code_file = scripts[0].name
                  meta["kernel_type"] = "script"
              else:
                  raise SystemExit("No .ipynb or .py file was pulled.")

              meta["code_file"] = code_file

          meta["language"] = "python"
          meta["enable_internet"] = True
          meta["enable_gpu"] = True
          meta["machine_shape"] = os.environ["KAGGLE_ACCELERATOR"]

          # ----------------------------------------------------------
          # IMPORTANT:
          # We do NOT call `kaggle datasets files`.
          #
          # The previous workflow did that and received:
          #   403 Forbidden ListDatasetFiles
          #
          # Instead, we directly place the known private dataset
          # reference into the notebook metadata.
          #
          # The dataset must already exist under this Kaggle account.
          # It is created/updated from the Kaggle notebook bootstrap
          # cell using Kaggle Secrets.
          # ----------------------------------------------------------
          expected = os.environ["KAGGLE_SECRET_DATASET"]

          sources = meta.get("dataset_sources") or []

          if isinstance(sources, str):
              sources = [sources]
          elif not isinstance(sources, list):
              sources = list(sources)

          clean_sources = []
          for item in sources:
              item = str(item).strip()
              if item and item not in clean_sources:
                  clean_sources.append(item)

          if expected not in clean_sources:
              print(f"➕ Adding private dataset: {expected}")
              clean_sources.append(expected)
          else:
              print(f"✅ Private dataset already attached: {expected}")

          meta["dataset_sources"] = clean_sources

          meta_path.write_text(
              json.dumps(meta, indent=2) + "\n",
              encoding="utf-8",
          )

          print()
          print("===== FINAL KAGGLE CONFIGURATION =====")
          print("Kernel:", meta["id"])
          print("Code file:", meta["code_file"])
          print("Machine:", meta["machine_shape"])
          print("GPU enabled:", meta["enable_gpu"])
          print("Internet enabled:", meta["enable_internet"])
          print("Dataset attachments:")

          for source in clean_sources:
              print("  -", source)

          print()
          print("✅ Metadata prepared")
          PY

      - name: Validate final Kaggle metadata
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["WORK_DIR"]) / "kernel-metadata.json"
          meta = json.loads(path.read_text(encoding="utf-8"))

          expected_kernel = os.environ["KAGGLE_KERNEL"]
          expected_dataset = os.environ["KAGGLE_SECRET_DATASET"]
          expected_machine = os.environ["KAGGLE_ACCELERATOR"]

          if meta.get("id") != expected_kernel:
              raise SystemExit(
                  f"Kernel identity mismatch: {meta.get('id')!r}"
              )

          if meta.get("machine_shape") != expected_machine:
              raise SystemExit(
                  f"Machine shape mismatch: {meta.get('machine_shape')!r}"
              )

          datasets = meta.get("dataset_sources") or []

          if expected_dataset not in datasets:
              raise SystemExit(
                  f"Required dataset was not attached: {expected_dataset}"
              )

          code_file = meta.get("code_file")

          if not code_file:
              raise SystemExit("Missing code_file in kernel metadata.")

          if not (Path(os.environ["WORK_DIR"]) / code_file).is_file():
              raise SystemExit(
                  f"Configured code_file does not exist: {code_file}"
              )

          print("✅ Metadata validation passed")
          print("Kernel:", expected_kernel)
          print("Code:", code_file)
          print("Machine:", expected_machine)
          print("Private dataset:", expected_dataset)
          PY

      - name: Push and start Personal AI on Kaggle
        shell: bash
        run: |
          set -euo pipefail

          echo "🚀 Pushing Personal AI to Kaggle..."
          echo "Notebook: ${KAGGLE_KERNEL}"
          echo "GPU: ${KAGGLE_ACCELERATOR}"
          echo "Private dataset: ${KAGGLE_SECRET_DATASET}"

          # Do NOT use --accelerator here.
          # machine_shape is already written to kernel-metadata.json.
          kaggle kernels push \
            -p "${WORK_DIR}"

          echo "✅ Kaggle kernel push accepted"

      - name: Confirm Kaggle run
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..18}; do
            echo "===== Kaggle status check ${i}/18 ====="

            OUT="$(
              kaggle kernels status "${KAGGLE_KERNEL}" 2>&1 || true
            )"

            echo "${OUT}"

            if echo "${OUT}" | grep -Eiq \
              'error|failed|failure|cancelled|canceled'; then
              echo "::error::Kaggle reported a failed/cancelled run."
              exit 1
            fi

            if echo "${OUT}" | grep -Eiq \
              'running|queued|pending'; then
              echo "✅ Personal AI is queued/running."
              exit 0
            fi

            if echo "${OUT}" | grep -Eiq \
              'complete|completed'; then
              echo "::warning::Notebook completed. Check Kaggle output/logs."
              exit 0
            fi

            sleep 10
          done

          echo "::warning::Push succeeded, but the Kaggle status did not settle during the polling window."
          exit 0

      - name: Startup submitted
        shell: bash
        run: |
          echo "=============================================="
          echo "✅ PERSONAL AI START REQUEST SUBMITTED"
          echo "=============================================="
          echo "Notebook: ${KAGGLE_KERNEL}"
          echo "Private dataset: ${KAGGLE_SECRET_DATASET}"
          echo "GPU: ${KAGGLE_ACCELERATOR}"
          echo "=============================================="
